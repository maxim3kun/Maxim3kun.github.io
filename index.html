<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaximeGPT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    h1 span {
      color: #7c6aff;
    }
    p {
      font-size: 1.2rem;
      color: #888;
      max-width: 480px;
      line-height: 1.6;
    }
    a {
      margin-top: 2rem;
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #7c6aff;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.2s;
    }
    a:hover { background: #6655e0; }
  </style>
</head>
<body>
  <h1>Maxime<span>GPT</span></h1>
  <p>Coming soon. Building something great at <strong>www.maximegpt.com</strong>.</p>
</body>
</html>
